
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vancouver Park Accessibility</title>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    // Create the map, centred on Vancouver
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-123.12, 49.25],
      zoom: 11
    });

    // Add zoom and rotation controls
    map.addControl(new maplibregl.NavigationControl());

    // Load the parks data after the map loads
    map.on('load', () => {

      map.addSource('parks', {
        type: 'geojson',
        data: './parks-polygon-representation.geojson'
      });

      // Display park polygons
      map.addLayer({
        id: 'parks-fill',
        type: 'fill',
        source: 'parks',
        paint: {
          'fill-color': '#65A87A',
          'fill-opacity': 0.65
        }
      });

      // Add park outlines
      map.addLayer({
        id: 'parks-outline',
        type: 'line',
        source: 'parks',
        paint: {
          'line-color': '#326B46',
          'line-width': 1
        }
      });

    });
  </script>
</body>
</html>
