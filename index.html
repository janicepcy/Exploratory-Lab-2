
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vancouver Park Accessibility</title>

  <!-- MapLibre GL JS -->
  <link
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    rel="stylesheet"
  >
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Turf.js for geographic analysis -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- Interactive map -->
  <div id="map"></div>

  <!-- Map title -->
  <div class="map-title">
    <h1>Vancouver Park Accessibility</h1>
    <p>
      Exploring Vancouver's public parks and their
      accessibility within a 500-metre radius.
      Click anywhere on the map to select a location.
    </p>
  </div>

  <!-- Map legend -->
  <div class="map-legend">
    <h3>Park Area</h3>

    <div class="legend-item">
      <span class="legend-color small"></span>
      <span>Small (&lt; 1 ha)</span>
    </div>

    <div class="legend-item">
      <span class="legend-color medium"></span>
      <span>Medium (1–5 ha)</span>
    </div>

    <div class="legend-item">
      <span class="legend-color large"></span>
      <span>Large (5+ ha)</span>
    </div>

    <div class="legend-item">
      <span
        style="
          display:inline-block;
          width:18px;
          height:18px;
          background:rgba(231,111,81,0.18);
          border:2px solid #E76F51;
          box-sizing:border-box;
          margin-right:8px;
        "
      ></span>
      <span>500 m accessibility buffer</span>
    </div>
  </div>

  
  <!-- Park accessibility results -->
  <div id="accessibility-results"
       style="
         position: absolute;
         top: 220px;
         left: 20px;
         background: white;
         padding: 15px;
         border-radius: 6px;
         box-shadow: 0 2px 8px rgba(0,0,0,0.2);
         font-family: Arial, sans-serif;
         z-index: 2;
         display: none;
         max-width: 250px;
       ">
    <h3>Park Accessibility</h3>
    <p id="park-count"></p>
    <h3>Park Accessibility</h3>
    <p id="park-count"></p>
    <div id="park-size-breakdown"></div>
  
  </div>

  <script>

    // Initialize the MapLibre map
    const map = new maplibregl.Map({
      container: 'map',
      style: './vancouver-parks-style(export).json',
      center: [-123.12, 49.25],
      zoom: 11.5
    });

    // Add zoom and rotation controls
    map.addControl(new maplibregl.NavigationControl());

    // Store the user's selected location
    let selectedLocation = null;
    let locationMarker = null;

    // Add buffer source and layers after map loads
    map.on('load', () => {

      // Empty GeoJSON source for accessibility buffer
      map.addSource('accessibility-buffer', {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: []
        }
      });

      // Transparent orange buffer fill
      map.addLayer({
        id: 'buffer-fill',
        type: 'fill',
        source: 'accessibility-buffer',
        paint: {
          'fill-color': '#E76F51',
          'fill-opacity': 0.18
        }
      });

      // Orange outline around buffer
      map.addLayer({
        id: 'buffer-outline',
        type: 'line',
        source: 'accessibility-buffer',
        paint: {
          'line-color': '#E76F51',
          'line-width': 2
        }
      });

      // Source for parks intersecting the buffer
      map.addSource('accessible-parks', {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: []
        }
      });

      // White overlay that pulses over accessible parks 
      map.addLayer({
        id: 'accessible-parks-pulse',
        type: 'fill',
        source: 'accessible-parks',
        paint: {
          'fill-color': '#FFFFFF',
          'fill-opacity': 0
        }
      });

      // Animate the overlay opacity
      let pulseOpacity = 0;
      let pulseDirection = 1;

      function animateParks() {
        pulseOpacity += 0.008 * pulseDirection;

        if (pulseOpacity >= 0.35) {
          pulseDirection = -1;
        }

        if (pulseOpacity <= 0) {
          pulseDirection = 1;
        }

        map.setPaintProperty(
          'accessible-parks-pulse',
          'fill-opacity',
          Math.max(0, Math.min(0.35, pulseOpacity))
        );

        requestAnimationFrame(animateParks);
      }

      animateParks();
    });

    // Display park information when clicked
    map.on('click', 'vancouver-parks-fill', (e) => {

      const park = e.features[0].properties;

      // Read attributes from GeoJSON
      const name = park.park_name || 'Unnamed Park';
      const rawArea = park.area_hectare;
      const area = Number(rawArea);
      const classification =
        park.classification || 'Not specified';

      // Check whether area is available
      const hasArea =
        rawArea !== null &&
        rawArea !== undefined &&
        String(rawArea).trim() !== '' &&
        Number.isFinite(area);

      // Determine park size using legend thresholds
      let sizeCategory = 'Area unavailable';

      if (hasArea) {
        if (area < 1) {
          sizeCategory = 'Small park (< 1 ha)';
        } else if (area < 5) {
          sizeCategory = 'Medium park (1–5 ha)';
        } else {
          sizeCategory = 'Large park (5+ ha)';
        }
      }

      // Create popup content
      const popup = document.createElement('div');

      // Park name
      const heading = document.createElement('h3');
      heading.textContent = name;
      heading.style.margin = '0 0 10px 0';
      popup.appendChild(heading);

      // Park area
      const areaText = document.createElement('p');
      areaText.textContent = 'Area: ' +
        (hasArea ? area.toFixed(2) + ' ha' : 'Not available');
      popup.appendChild(areaText);

      // Park size category
      const sizeText = document.createElement('p');
      sizeText.textContent = 'Size category: ' + sizeCategory;
      popup.appendChild(sizeText);

      // Park classification
      const typeText = document.createElement('p');
      typeText.textContent = 'Classification: ' + classification;
      popup.appendChild(typeText);

      // Display popup at clicked location
      new maplibregl.Popup({
        closeButton: true,
        closeOnClick: true
      })
        .setLngLat(e.lngLat)
        .setDOMContent(popup)
        .addTo(map);

    });

    // Change cursor when hovering over parks
    map.on('mouseenter', 'vancouver-parks-fill', () => {
      map.getCanvas().style.cursor = 'pointer';
    });

    // Restore cursor when leaving parks
    map.on('mouseleave', 'vancouver-parks-fill', () => {
      map.getCanvas().style.cursor = '';
    });

    // Allow users to select a location by clicking the map
    map.on('click', (e) => {

      // Save selected coordinates
      selectedLocation = [
        e.lngLat.lng,
        e.lngLat.lat
      ];

      // Create a 500-metre buffer using Turf.js
      const buffer = turf.buffer(
        turf.point(selectedLocation),
        0.5,
        { units: 'kilometers' }
      );

      // Update the buffer GeoJSON source
      const bufferSource = map.getSource('accessibility-buffer');

      if (bufferSource) {
        bufferSource.setData(buffer);
      }

      
// Load park polygons and count those intersecting the buffer
fetch('./parks-polygon-representation.geojson')
  .then(response => {
    if (!response.ok) {
      throw new Error('Could not load park GeoJSON');
    }
    return response.json();
  })
  .then(parkData => {

    let parkCount = 0;

    const accessibleParks = [];

    parkData.features.forEach(park => {
      if (park.geometry &&
          turf.booleanIntersects(park, buffer)) {
        parkCount++;
        accessibleParks.push(park);
      }
    });

    
let smallParks = 0;
let mediumParks = 0;
let largeParks = 0;
let unknownParks = 0;

// Classify parks within the 500 m buffer
accessibleParks.forEach(park => {
    const rawArea = park.properties.area_hectare;

    if (rawArea === null ||
        rawArea === undefined ||
        String(rawArea).trim() === '' ||
        !Number.isFinite(Number(rawArea))) {
        unknownParks++;
        return;
    }

    const area = Number(rawArea);

    if (area < 1) {
        smallParks++;
    } else if (area < 5) {
        mediumParks++;
    } else {
        largeParks++;
    }
});


    // Update the pulsing park layer
    map.getSource('accessible-parks').setData({
      type: 'FeatureCollection',
      features: accessibleParks
    });

    // Display accessibility results
    document.getElementById('park-count').textContent =
      parkCount + ' park polygons intersect the 500 m buffer.';

    document.getElementById('accessibility-results')
      .style.display = 'block';

  })
  .catch(error => {
    console.error('Park accessibility analysis failed:', error);
  });


      // Remove previous marker
      if (locationMarker) {
        locationMarker.remove();
      }

      // Add an orange marker at selected location
      locationMarker = new maplibregl.Marker({
        color: '#E76F51'
      })
        .setLngLat(selectedLocation)
        .addTo(map);

      // Log selected location for testing
      console.log('Selected location:', selectedLocation);

    });

 
  </script>

</body>
</html>
